{
  "Name": "openssl",
  "Language": "c",
  "Dir": "./include/openssl",
  "Files": ["ssl.h"],
  "LLGoPackage": "link: $(pkg-config --libs openssl); -lssl -lcrypto",
  "MacroIgnore": [
    "SSL_TXT_kECDHe",
    "SSL_TXT_aDH",
    "SSL_TXT_aECDH"
  ],
  "TypeAlias": {
    "timeval": "syscall.Timeval"
  },
  "IgnoreInline": true,
  "MethodCheck": [
    "__never__: __never__"
  ]
}
