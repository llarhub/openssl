{
  "Name": "openssl",
  "LLGoPackage": "link: $(pkg-config --libs openssl); -lssl -lcrypto",
  "Dir": "./include/openssl",
  "MacroIgnore": [
    "SSL_TXT_kECDHe",
    "SSL_TXT_aDH",
    "SSL_TXT_aECDH"
  ],
  "FailFast": 10,
  "IgnoreInline": true,
  "Language": "c",
  "Files": [
    "ssl.h"
  ],
  "MethodCheck": [
    "__never__: __never__"
  ]
}
