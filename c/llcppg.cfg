{
  "Name": "openssl",
  "Language": "c",
  "Dir": "./include/openssl",
  "Files": ["ssl.h"],
  "LLGoPackage": "link: $(pkg-config --libs openssl); -lssl -lcrypto",
  "NonClass": ["EC_builtin_curve", "SSL_POLL_ITEM"],
  "MacroIgnore": [],
  "FuncIgnore": ["BN_is_prime"],
  "FuncPrefix": ["OPENSSL_"],
  "MethodCheck": [],
  "TypeAbbr": [
    "BIGNUM: BN",
    "BIO_METHOD: BIO_meth",
    "COMP_CTX: COMP",
    "COMP_METHOD: COMP",
    "CRYPTO_EX_DATA: CRYPTO",
    "CONF: NCONF",
    "CONF_MODULE: CONF_module",
    "CONF_IMODULE: CONF_imodule",
    "CONF_METHOD: CONF",
    "DH_METHOD: DH_meth",
    "DSA_METHOD: DSA_meth",
    "EC_KEY_METHOD: EC_KEY",
    "EVP_CIPHER: EVP",
    "EVP_CIPHER_CTX: EVP_CIPHER, EVP",
    "EVP_ENCODE_CTX: EVP",
    "EVP_MAC_CTX: EVP_MAC",
    "EVP_MD_CTX: EVP",
    "EVP_PKEY_CTX: EVP_PKEY",
    "EVP_RAND_CTX: EVP_RAND",
    "HMAC_CTX: HMAC",
    "INIT_SETTINGS: INIT",
    "ASN1_ITEM: ASN1_item",
    "ASN1_OBJECT: OBJ",
    "OSSL_CORE_HANDLE: OSSL",
    "OSSL_HPKE_CTX: OSSL_HPKE",
    "OSSL_HPKE_SUITE: OSSL_HPKE",
    "OSSL_HTTP_REQ_CTX: OSSL_HTTP",
    "PKCS7_SIGNER_INFO: PKCS7",
    "PKCS8_PRIV_KEY_INFO: PKCS8, EVP",
    "RSA_METHOD: RSA_meth",
    "SHA256_CTX: SHA256",
    "SHA512_CTX: SHA512",
    "SHA_CTX: SHA1",
    "SSL_CONF_CTX: SSL_CONF",
    "SSL_METHOD: SSL",
    "X509_LOOKUP_METHOD: X509_LOOKUP_meth",
    "X509_POLICY_NODE: X509_policy_node",
    "X509_POLICY_TREE: X509_policy_tree",
    "Lhash_st_CONF_VALUE: CONF",
    "LHASH: LH"
  ],
  "TypePrefix": ["OPENSSL_"],
  "TypeAlias": {
    "timeval": "syscall.Timeval"
  },
  "Rename": {
    "BIO_new": "New",
    "BIO_get_indent": "GetIndent",
    "PKCS7_get_detached": "GetDetached",
    "NCONF_new": "New",
    "EC_GROUP_new_from_ecparameters": "New",
    "EC_GROUP_new_from_ecpkparameters": "New",
    "EVP_PKEY2PKCS8": "To_PKCS8",
    "DH_set_default_method": "SetDefaultMethod",
    "OSSL_HTTP_exchange": "HTTP_exchange",
    "X509_LOOKUP_meth_get_free": "GetFree",
    "SSL_COMP_get_name": "SSL_Name",
    "SSL_get_version": "GetVersion"
  },
  "FailFast": 10,
  "IgnoreInline": true
}
